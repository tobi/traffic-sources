[package]
name = "traffic-sources"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Attribute web traffic (channel, source, paid/organic, surface, device, bot class) from access logs and headers, returning all ranked candidates with confidence."
repository = "https://github.com/tobi/traffic-sources"
homepage = "https://github.com/tobi/traffic-sources"
documentation = "https://docs.rs/traffic-sources"
readme = "README.md"
keywords = ["attribution", "analytics", "referrer", "user-agent", "utm"]
categories = ["web-programming", "parser-implementations", "command-line-utilities"]
exclude = ["/docs", "/reference", "/.github"]

[lib]
name = "traffic_sources"
path = "src/lib.rs"

[[bin]]
name = "traffic-sources"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
